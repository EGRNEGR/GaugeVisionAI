  <script>
    /* Настройки Tweaks — до первой отрисовки, без скачка вёрстки. Полная логика — js/tweaks.js.
       Кнопку Tweaks видит только автор: адрес с ?tweaks включает её на этом устройстве, ?tweaks=off — выключает. */
    (function () {
      var d = document.documentElement;
      var q = location.search;
      var on = /[?&]tweaks(=on|=1)?(&|$)/.test(q);
      var off = /[?&]tweaks=off(&|$)/.test(q);
      try {
        if (on) localStorage.setItem('gv4.tweaks.on', '1');
        if (off) localStorage.removeItem('gv4.tweaks.on');
        if (localStorage.getItem('gv4.tweaks.on') === '1') d.setAttribute('data-tweaks', 'on');
        var t = JSON.parse(localStorage.getItem('gv4.tweaks') || '{}');
        if (['auto', 'onest', 'manrope', 'plex'].indexOf(t.font) >= 0) d.setAttribute('data-font', t.font);
        if ([0.9, 1, 1.1, 1.25].indexOf(t.scale) >= 0) d.style.setProperty('--ui-scale', String(t.scale));
        if (['warm', 'blueprint', 'dial', 'obsidian'].indexOf(t.ambient) >= 0) d.setAttribute('data-ambient', t.ambient);
      } catch (e) {
        if (on) d.setAttribute('data-tweaks', 'on');
      }
      if (/[?&]showcase=(1|on|true)(&|$)/.test(q)) d.setAttribute('data-showcase-boot', '');
    })();
  </script>
</head>

    </div>
  </noscript>
