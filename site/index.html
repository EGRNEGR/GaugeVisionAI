<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaugeVision AI — прибор пишет журнал сам</title>
  <meta name="description" content="GaugeVision AI снимает показания стрелочных приборов КИПиА камерой снаружи контура: без врезки, останова и интернета. YOLOv8n и OpenCV на одном сервере.">
  <meta name="theme-color" content="#E9EBE4">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- Порядок стилей: шрифты → токены → база → движение → страница → листы → Tweaks -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/gauge.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/shift.css">
  <link rel="stylesheet" href="css/dial.css">
  <link rel="stylesheet" href="css/operations.css">
  <link rel="stylesheet" href="css/ledger.css">
  <link rel="stylesheet" href="css/schema.css">
  <link rel="stylesheet" href="css/tweaks.css">

  <script>
    /* Настройки Tweaks — до первой отрисовки, без скачка вёрстки. Полная логика — js/tweaks.js.
       Кнопку Tweaks видит только автор: адрес с ?tweaks включает её на этом устройстве, ?tweaks=off — выключает. */
    (function () {
      var d = document.documentElement;
      var q = location.search;
      var on = /[?&]tweaks(=on|=1)?(&|$)/.test(q);
      var off = /[?&]tweaks=off(&|$)/.test(q);
      try {
        if (on) localStorage.setItem('gv.tweaks.on', '1');
        if (off) localStorage.removeItem('gv.tweaks.on');
        if (localStorage.getItem('gv.tweaks.on') === '1') d.setAttribute('data-tweaks', 'on');
        var t = JSON.parse(localStorage.getItem('gv.tweaks') || '{}');
        if ([0.9, 1, 1.1, 1.25].indexOf(t.scale) >= 0) d.style.setProperty('--ui-scale', String(t.scale));
        if (['ledger', 'graph', 'tracing'].indexOf(t.paper) >= 0) d.setAttribute('data-paper', t.paper);
      } catch (e) {
        if (on) d.setAttribute('data-tweaks', 'on');
      }
    })();
  </script>
</head>
<body>
  <a class="gv-skip" href="#gv-main">К содержанию</a>

  <div id="gv-root"></div>

  <noscript>
    <div class="gv-noscript">
      <p>Журнал обхода и показаний КИП, котельный цех</p>
      <h1>Прибор пишет журнал сам</h1>
      <p>GaugeVision AI снимает стрелку КИПиА камерой снаружи контура: без врезки, останова и интернета.</p>
      <p><a href="https://github.com/EGRNEGR/GaugeVisionAI">Код на GitHub</a></p>
    </div>
  </noscript>

  <aside id="gv-tweaks" aria-label="Настройки внешнего вида"></aside>

  <!-- Порядок скриптов: content → util → motion → components/kit → components/* → tweaks → page (последним) -->
  <script src="js/content.js"></script>

  <script src="js/motion.js"></script>
  <script src="js/components/kit.js"></script>

  <script src="js/components/limits.js"></script>
  <script src="js/components/contact.js"></script>
  <script src="js/tweaks.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
