<!doctype html>
<html lang="ru" data-font="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaugeVision AI — стрелочные приборы ТЭЦ на пульте оператора</title>
  <meta name="description" content="GaugeVision AI снимает показания стрелочных приборов КИПиА камерой: без врезки, кабелей и останова. YOLOv8n и OpenCV в локальном контуре.">
  <meta name="theme-color" content="#090B0E">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- Порядок стилей: шрифты → токены → база → движение → компоненты → страница → Tweaks -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/dial.css">
  <link rel="stylesheet" href="css/track.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/tweaks.css">

  <script>
    /* Масштаб и шрифт из Tweaks — до первой отрисовки, без скачка вёрстки. Полная логика — js/tweaks.js. */
    (function () {
      var d = document.documentElement;
      try {
        var t = JSON.parse(localStorage.getItem('gv.tweaks') || '{}');
        if (['auto', 'onest', 'manrope', 'plex'].indexOf(t.font) >= 0) d.setAttribute('data-font', t.font);
        if ([0.9, 1, 1.1, 1.25].indexOf(t.scale) >= 0) d.style.setProperty('--ui-scale', String(t.scale));
      } catch (e) {
        d.setAttribute('data-boot', 'defaults');
      }
    })();
  </script>
</head>
<body>
  <a class="gv-skip" href="#gv-main">К содержанию</a>

  <div id="gv-root"></div>

  <noscript>
    <div class="gv-noscript">
      <p class="gv-noscript__meta">Трек №3 · Умное производство</p>
      <h1 class="gv-noscript__title">GaugeVision AI</h1>
      <p>Камера снимает показания стрелочных приборов КИПиА и передаёт их на пульт оператора&nbsp;— без врезки, кабелей и останова.</p>
      <a class="gv-button" href="https://github.com/EGRNEGR/GaugeVisionAI">Код на GitHub</a>
    </div>
  </noscript>

  <aside id="gv-tweaks" aria-label="Настройки внешнего вида"></aside>

  <!-- Порядок скриптов: content → util → motion → components/kit → components/* → tweaks → page (последним) -->
  <script src="js/content.js"></script>
  <script src="js/util.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/components/kit.js"></script>
  <script src="js/components/scroll-video.js"></script>
  <script src="js/components/precision-dial.js"></script>
  <script src="js/components/pipeline-track.js"></script>
  <script src="js/components/metrics.js"></script>
  <script src="js/components/compare.js"></script>
  <script src="js/components/architecture.js"></script>
  <script src="js/components/limits.js"></script>
  <script src="js/tweaks.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
