# Публикация лендинга site/ на GitHub Pages: при пуше в main и вручную из вкладки Actions.
# Сборки нет — в Pages уходит папка site/ как есть, после проверок лендинга.
name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз; идущую не отменяем, промежуточные в очереди пропускаются
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Проверка лендинга
        run: |
          node site/tests/check.js
          node site/tests/components.test.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
